name: Build and Package with Docker Compose

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Étape 1 : Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 2 : Configurer Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Étape 3 : Construire et démarrer les conteneurs Docker Compose
      - name: Build and start Docker Compose
        run: |
          docker-compose -f docker-compose.yml up --build -d
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "P@ssw0rd2023!" # Vous pouvez utiliser des secrets pour plus de sécurité
          RABBITMQ_DEFAULT_USER: "admin"
          RABBITMQ_DEFAULT_PASS: "admin"

      # Étape 4 : Packager les images Docker
      - name: Save Docker images as tar
        run: docker save lab_rabbitmq lab_mssql lab_console lab_api > docker-images.tar

      # Étape 5 : Copier le package dans le projet
      - name: Move package to project directory
        run: mv docker-images.tar ./docker-package/docker-images.tar

      # Étape 6 : Commit et push le package
      - name: Commit and push Docker package
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add ./docker-package/docker-images.tar
          git commit -m "Add Docker package"
          git push origin main
