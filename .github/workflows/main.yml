name: Build and Package with Docker Compose
on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          
      - name: Build and start Docker Compose
        run: |
          docker-compose -f docker-compose.yml up --build -d
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "P@ssw0rd2023!" # Utilisez des secrets pour plus de sécurité
          RABBITMQ_DEFAULT_USER: "admin"
          RABBITMQ_DEFAULT_PASS: "admin"

      - name: Save Docker images
        run: |
          docker save rabbitmq mssql api console > docker-images.tar

      - name: Create docker-package directory
        run: mkdir -p docker-package

      - name: Move package to project directory
        run: mv docker-images.tar docker-package/

      - name: Commit and push Docker package
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-package/docker-images.tar
          git commit -m "Add Docker package"
          git push origin develop
