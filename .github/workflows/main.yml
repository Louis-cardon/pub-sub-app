name: Build and Package with Docker Compose

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Étape 1 : Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 2 : Configurer Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Ajoutez ce secret dans GitHub
          password: ${{ secrets.DOCKER_PASSWORD }} # Ajoutez ce secret dans GitHub

      # Étape 3 : Construire et démarrer les conteneurs Docker Compose
      - name: Build and start Docker Compose
        run: |
          docker-compose -f docker-compose.yml up --build -d
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "P@ssw0rd2023!" # Utilisez des secrets si possible
          RABBITMQ_DEFAULT_USER: "admin"
          RABBITMQ_DEFAULT_PASS: "admin"

      # Étape 4 : Vérifier l'état des conteneurs
      - name: Check running containers
        run: docker ps

      # Étape 5 : Packager les images Docker pour le déploiement
      - name: Save Docker images as artifacts
        run: |
          docker save lab_rabbitmq lab_mssql lab_console lab_api > docker-images.tar
        uses: actions/upload-artifact@v3
        with:
          name: docker-images
          path: docker-images.tar

      # Étape 6 : Nettoyer l'environnement Docker
      - name: Clean up Docker
        run: docker-compose -f docker-compose.yml down
